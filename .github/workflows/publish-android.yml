# Build the release .so for all ABIs and publish the :rustplayer AAR to GitHub
# Packages (cz.preclikos:rustplayer:<version>). Consumers then add it as a plain
# Gradle dependency — no NDK / cargo / Rust on their side.
#
# Runs on the self-hosted Linux runner ("makak"). JDK + Android SDK are
# provisioned per-job via setup-java / setup-android (same as BlackZoneAndroid);
# the NDK + Rust toolchain are added on top for our cargo-ndk cdylib build.
# Trigger: push a tag `android-v1.2.3`, or run manually with an explicit version.
name: Publish Android AAR

on:
  workflow_dispatch:
    inputs:
      skip_conformance:
        description: "Publish even without a green conformance run for this commit"
        required: false
        default: "false"
      version:
        description: "rustplayer version (e.g. 0.0.1)"
        required: true
  push:
    tags: ["android-v*"]

jobs:
  publish:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A tag publishes only what conformance has passed: the run for this
      # exact commit, or — for a commit that did not touch player/** and so
      # never triggered one — the newest green run on an ancestor with no
      # player changes since. `skip_conformance: true` (dispatch) overrides.
      - name: Require green conformance for this commit
        if: ${{ github.event.inputs.skip_conformance != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/conformance/require-green.sh "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      # `packages` is pinned to drop the action's default "tools
      # platform-tools": the legacy `tools` package no longer resolves in
      # Google's SDK repository ("Warning: Failed to find package 'tools'"),
      # which fails the step outright. Nothing here needs it — the NDK comes
      # from the explicit sdkmanager call below and AGP pulls its own
      # build-tools/platform.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.13113456"

      # Make the toolchain the build actually used visible in the log, and fail
      # loudly if rustup is not in charge: rust-toolchain.toml only binds the
      # version when cargo comes from rustup, so a system rust on a runner would
      # silently build with whatever it happens to be.
      - name: Report rust toolchain
        run: |
          set -e
          rustup show active-toolchain
          rustc --version

      - name: Ensure Rust Android targets + cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .so (all ABIs, release) + publish AAR
        working-directory: platform/android/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # :rustplayer:publish → preReleaseBuild → buildRustRelease + copyLibCxxShared.
        # The buildRust task resolves the NDK from the SDK (ndk;29.0.13113456).
        run: bash ./gradlew :rustplayer:publish -Prustplayer.version=${{ steps.ver.outputs.version }} --no-daemon --stacktrace

      # Native crash symbols go to Crashlytics and nowhere else. This repo and
      # its packages are public, so the unstripped librustplayer.so (line
      # tables + symbol table) is never published: the AAR carries the
      # stripped build (same GNU build-id), this step hands the unstripped
      # twin to Crashlytics for every app listed in the CRASHLYTICS_APP_IDS
      # repo variable, and the next step deletes it from the runner.
      # Auth: FIREBASE_SERVICE_ACCOUNT secret = a service-account key JSON with
      # the "Firebase Crashlytics Admin" role on the apps' Firebase project.
      - name: Set up Node (firebase-tools)
        if: ${{ vars.CRASHLYTICS_APP_IDS != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upload native symbols to Crashlytics
        if: ${{ vars.CRASHLYTICS_APP_IDS != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_IDS: ${{ vars.CRASHLYTICS_APP_IDS }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set - native crash symbols for this release are NOT in Crashlytics"
            exit 1
          fi
          creds="$RUNNER_TEMP/firebase-sa.json"
          ( umask 077; printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds" )
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          for app in ${APP_IDS//,/ }; do
            npx --yes firebase-tools@15 crashlytics:symbols:upload --app="$app" \
              platform/android/android/rustplayer/build/native-symbols
          done

      - name: Delete unstripped libraries and credentials
        if: always()
        run: |
          rm -rf platform/android/android/rustplayer/build/native-symbols \
                 "$RUNNER_TEMP/firebase-sa.json" "${TMPDIR:-/tmp}"/crashlytics-*

# Browser build check. The wasm32 target needs no FFmpeg, no NDK and no GPU,
# so this is the cheapest platform to keep green: it catches engine changes
# that reach for something the browser build can't have (a thread, a
# blocking call, `std::time::Instant`, a native-only dependency).
#
# Only a compile check + the engine's unit tests on the host. Playback
# itself is verified by hand in a browser (platform/web/README.md); a
# headless WebCodecs/WebGPU harness is a later step.
name: web-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "player/**"
      - "bridge/**"
      - "platform/web/**"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web-check.yml"
  push:
    branches: [master]
    paths:
      - "player/**"
      - "bridge/**"
      - "platform/web/**"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web-check.yml"

jobs:
  check:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Ensure rust toolchain
        run: |
          set -e
          if ! command -v "$HOME/.cargo/bin/cargo" >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Report rust toolchain
        run: |
          set -e
          rustup show active-toolchain
          rustc --version
          rustup target add wasm32-unknown-unknown

      - name: Check the browser shell (engine + bridge + bridge-web, wasm32)
        run: cargo check -p bridge-web --target wasm32-unknown-unknown

      - name: Check the browser shell (release)
        run: cargo check -p bridge-web --target wasm32-unknown-unknown --release

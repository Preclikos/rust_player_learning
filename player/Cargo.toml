[package]
name = "player"
version = "0.1.0"
edition = "2021"

[lib]
name = "player"
path = "src/lib.rs"

[dependencies]
# TLS backend is target-specific (see [target.cfg.dependencies] below).
# Base dep on every target (the browser build included — reqwest speaks
# `fetch` there). Native-only features (HTTP/2, TLS backends) live in the
# per-target blocks below.
reqwest = { version = "0.13", default-features = false, features = ["charset"] }
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
iso8601-duration = { version = "0.2" }
url = { version = "2.5.4" }
# Only the runtime-agnostic pieces here (channels, Notify, RwLock,
# select!/join!) — these are what the engine uses everywhere, and they are
# what Tokio supports on wasm32-unknown-unknown. The runtime itself
# (`rt-multi-thread`, timers, blocking pool) is native-only and enabled in
# the `cfg(not(target_arch = "wasm32"))` block below; engine code reaches it
# through the `rt` facade (src/rt.rs), never `tokio::spawn` directly.
tokio = { version = "1.52", features = ["sync", "macros"] }
re_mp4 = { version = "0.5.0" }
hex = { version = "0.4" }
aes = { version = "0.9" }
ctr = { version = "0.10" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
arc-swap = "1.7"
bytes = "1"
rand = "0.10"
# Wrapped ClearKey licences (src/wrapped_licence.rs): request/response JSON.
serde_json = "1"
# 0.18 AAudio: requests PERFORMANCE_MODE_LOW_LATENCY under the `realtime`
# feature (collapses Android output latency to ~one burst — fixes video
# leading audio with no per-device tuning; degrades gracefully to normal
# mode, emitting RealtimeDenied via the error callback, if not granted).
# 0.18 also folds hardware latency into the CoreAudio/WASAPI playback
# timestamps, so the renderer's output-latency compensation is accurate
# on desktop + Apple too.
bytemuck ={ version =  "1.13.1" }
pollster = "0.4.0"
wgpu = { git = "https://github.com/Preclikos/wgpu.git" }
# Raw window/display handle types for building wgpu surfaces from a
# host-provided window/layer. The player is winit-free — hosts pass handles in.
# Pinned to the same major as the wgpu fork so the handle types unify.
raw-window-handle = "0.6"
log = "0.4"
# Subtitle font rasterization. Pure-Rust, no system deps. Used by the
# wgpu-based subtitle overlay to bake cue text into RGBA bitmaps that
# get uploaded as textures and drawn over the video surface.
fontdue = "0.9"
# Normalize WebVTT cue text to NFC before rasterization. fontdue has no
# shaping engine, so a decomposed sequence (e.g. "e" + U+030C combining
# caron) is rendered as two separate glyphs at the same pen position
# instead of the single precomposed "ě" U+011B. Czech / Slovak / Polish
# subs in NFD form looked garbled until this collapsed combining marks
# into the precomposed code points fonts actually carry glyphs for.
unicode-normalization = "0.1"

# Host-supplied sidecar subtitles (`Player::add_external_subtitle_track`)
# are whatever the user had on disk. UTF-8 is the spec for WebVTT but real
# `.srt` files are routinely CP1250 / ISO-8859-2 (Czech, Polish) or
# CP1252, with no declared charset anywhere in the file. `chardetng` is
# Firefox's detector, so it guesses the same way the browsers users
# compare us against do, and `encoding_rs` does the actual transcode (it
# is already in the tree via reqwest's `charset` feature).
encoding_rs = "0.8"
chardetng = "0.1"

# Native (everything but the browser): the Tokio runtime the engine runs
# on, HTTP/2 for the CDN fetches, cpal for PCM output, and the Vulkan
# bindings behind the D3D11/VAAPI/AHardwareBuffer zero-copy imports.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
# Wrapped ClearKey licences, native unwrap: ECDH P-256 + HKDF-SHA256 +
# AES-256-GCM (the browser uses WebCrypto for the same protocol).
p256 = { version = "0.14", default-features = false, features = ["ecdh", "std"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
# 0.18 AAudio: requests PERFORMANCE_MODE_LOW_LATENCY under the `realtime`
# feature (collapses Android output latency to ~one burst — fixes video
# leading audio with no per-device tuning; degrades gracefully to normal
# mode, emitting RealtimeDenied via the error callback, if not granted).
# 0.18 also folds hardware latency into the CoreAudio/WASAPI playback
# timestamps, so the renderer's output-latency compensation is accurate
# on desktop + Apple too.
cpal = { version = "0.18", features = ["realtime"] }
ash = "0.38.0"

# Browser (wasm32-unknown-unknown): WebCodecs decode, Web Audio output,
# wgpu on WebGPU (WebGL2 fallback) into a host canvas, fetch via reqwest.
#
# `fragile-send-sync-non-atomic-wasm`: wgpu's handles wrap JS objects and are
# `!Send` by default; this feature marks them Send/Sync on the single-threaded
# wasm target so the engine's native `Send` bounds compile unchanged. The
# same contract is applied to our own JS-holding wrappers (see rt/web.rs).
#
# WebCodecs (`VideoDecoder`, `AudioDecoder`, …) is behind web-sys's unstable
# gate: `.cargo/config.toml` passes `--cfg=web_sys_unstable_apis` for this
# target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { git = "https://github.com/Preclikos/wgpu.git", features = ["fragile-send-sync-non-atomic-wasm", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"
# rand → getrandom needs to be told to use `crypto.getRandomValues`.
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window", "WorkerGlobalScope", "Performance", "console",
    "HtmlCanvasElement", "MessageChannel", "MessagePort", "MessageEvent",
    "DomException",
    # WebCrypto (CENC AES-CTR off the main thread)
    "Crypto", "SubtleCrypto", "CryptoKey", "AesCtrParams",
    # WebCodecs (unstable — see above)
    "VideoDecoder", "VideoDecoderConfig", "VideoDecoderInit", "VideoDecoderSupport",
    "EncodedVideoChunk", "EncodedVideoChunkInit", "EncodedVideoChunkType",
    "VideoFrame", "VideoFrameCopyToOptions", "PlaneLayout", "VideoPixelFormat",
    # synthetic PQ VideoFrame for the HDR calibration (renderers/web_hdr_calib.rs)
    "VideoFrameBufferInit", "VideoColorSpaceInit", "VideoColorPrimaries",
    "VideoTransferCharacteristics", "VideoMatrixCoefficients",
    "DomRectInit", "DomRectReadOnly", "HardwareAcceleration", "CodecState",
    "AudioDecoder", "AudioDecoderConfig", "AudioDecoderInit", "AudioDecoderSupport",
    "EncodedAudioChunk", "EncodedAudioChunkInit", "EncodedAudioChunkType",
    "AudioData", "AudioDataCopyToOptions", "AudioSampleFormat",
    # Web Audio output (AudioWorklet; the processor module is served from a Blob URL)
    "AudioContext", "AudioContextOptions", "AudioContextState", "BaseAudioContext",
    "AudioDestinationNode", "AudioNode", "AudioWorklet", "AudioWorkletNode",
    "AudioWorkletNodeOptions", "ChannelInterpretation", "Blob", "BlobPropertyBag", "Url",
] }

# FFmpeg is used on every target except Android (MediaCodec). Win/Linux use it
# for both video + audio; macOS AND iOS use it for AUDIO only (native
# VideoToolbox stays for video). AudioToolbox's AAC decoder mis-behaves when fed
# access units packet-by-packet (confirmed on macOS sim AND iOS device), so we
# let the proven ffmpeg AAC / AC-3 / EAC-3 decoders handle that side.
#
# iOS links a STATIC, audio-only FFmpeg built by player/scripts/build-ffmpeg.sh
# (ios-arm64 / ios-sim-*); see app-ios/ios/build_sim.sh for the cross link wiring.
#
# Pinned to 8.1 series because ffmpeg-sys-next 7.1.x ships a bindgen that
# breaks against LLVM 22+ libclang (emits opaque struct shells with broken
# layout asserts — fails to compile under rustc 1.95+, which bundles LLVM 22).
# 8.1's bindgen handles LLVM 22 cleanly.
#
# ffmpeg-next 8.1.0 itself is patched via the workspace [patch.crates-io] to
# add `_ =>` wildcard arms to three match statements (AVCodecID,
# AVFrameSideDataType, AVPacketSideDataType) so it builds against FFmpeg 8.1.1+
# headers that have new enum variants (IAMF_*, DYNAMIC_HDR_SMPTE_2094_APP5, …).
# All target platforms ship FFmpeg 7.x system libs but the 8.x crate's
# bindings are generated against the system headers and have stayed ABI
# compatible.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos", target_os = "ios"))'.dependencies]
ffmpeg-next = { version = "8.1" }
ffmpeg-sys-next = { version = "8.1" }

# Win/Linux: native-tls (system OpenSSL/Schannel). macOS prefers rustls
# so we don't drag native-tls + OpenSSL into the build.
# NOTE: reqwest 0.13 redefined `default-tls` to mean rustls (it was native-tls
# in 0.12), so we now name `native-tls` explicitly to keep Schannel/OpenSSL.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Apple zero-copy interop, shared by macOS (FFmpeg VideoToolbox) and iOS
# (native VTDecompressionSession). Both pull a CVPixelBuffer through
# CVMetalTextureCache → MTLTextures → wgpu::Texture via
# wgpu_hal::metal::Device::texture_from_raw.
#
# Verze objc2 jsou pinnuté tak, aby přesně odpovídaly těm, které používá wgpu
# fork — jinak `Retained<ProtocolObject<dyn MTLTexture>>` co vyrobíme nesedne
# do signature `texture_from_raw`.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLResource",
    "MTLTexture",
    "MTLPixelFormat",
] }

# Android-only: MediaCodec via the ndk crate, JNI binding for Java interop,
# and rustls so reqwest doesn't need a cross-compiled OpenSSL. (No winit — the
# host Activity owns the Surface; see app-android.)
[target.'cfg(target_os = "android")'.dependencies]
# CENC decrypt fallback with a hardware AES backend for 32-bit ARM.
#
# The RustCrypto `aes` crate implements hardware AES for x86/x86_64 and
# aarch64 only. Android TV boxes routinely run a 32-bit userspace on ARMv8
# silicon (a Google TV Streamer reports abilist=armeabi-v7a while /proc/cpuinfo
# advertises `aes pmull`), and there `aes` falls back to the portable software
# backend: measured 10 MiB/s, which makes CENC decrypt the slowest step of
# segment preparation and the dominant cost of an ABR switch.
#
# aws-lc-rs is BoringSSL-derived and carries AES assembly for 32-bit ARM gated
# on HWCAP2_AES, so it reaches the silicon the `aes` crate cannot. It is
# already in this target's dependency graph via rustls, so it adds no new C
# build - which is also why this is scoped to Android rather than made global.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc"] }
ndk = { version = "0.9", features = ["media", "api-level-29"] }
ndk-sys = "0.6"
jni = "0.22"
# JavaVM/context handle seeded by the host shell — used for the few Java-only
# platform APIs (MediaCodecList decoder resolution; NDK has no codec list).
ndk-context = "0.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
glow = "0.17"

# iOS: rustls-tls so reqwest doesn't try to use native-tls (which has no
# default feature gate on iOS and silently links to nothing — every HTTPS
# call then fails with "error sending request" at the TLS layer). Video is
# native VideoToolbox; audio is FFmpeg (see the ffmpeg-next target block above
# — iOS is included there).
[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# rustls targets (macOS/iOS/Android): keep TLS self-contained with bundled
# Mozilla roots, exactly as reqwest 0.12's `rustls-tls` did. reqwest 0.13's
# `rustls` feature switched the default verifier to rustls-platform-verifier,
# which on Android needs the Android Context AND the verifier's Java classes on
# the app classpath — a runtime footgun for embedders. We sidestep it by handing
# reqwest a preconfigured rustls ClientConfig built from webpki-roots (net.rs).
# rustls tracks the same 0.23 line reqwest links so use_preconfigured_tls's
# Any-downcast unifies; default features give the aws-lc-rs provider.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
# Shader validation tests parse the WGSL with the same naga revision the
# wgpu fork compiles it with at runtime — a typo in a .wgsl otherwise only
# surfaces as a create_shader_module panic on the first rendered frame.
naga = { git = "https://github.com/Preclikos/wgpu.git", features = ["wgsl-in"] }
# Conformance soak harness (examples/conformance.rs) log output.
env_logger = "0.11"
# `start_paused` for the audio-output watchdog tests: tokio's virtual clock is
# what makes second-scale liveness thresholds testable without sleeping for them.
tokio = { version = "1.52", features = ["test-util", "macros", "rt"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [ "Win32_System_Com", "Win32_System_Console", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_Foundation", "Wdk_Foundation", "Win32_System_LibraryLoader",
             "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D12",
             "Win32_Security", "Win32_Security_Authorization", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Registry",
             "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem" ] }

